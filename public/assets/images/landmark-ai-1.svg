<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <pattern id="ai-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#ai-bg)"/>
  <rect width="1200" height="750" fill="url(#ai-grid)"/>

  <!-- Top bar -->
  <rect x="60" y="60" width="1080" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <circle cx="95" cy="85" r="7" fill="#EF4444"/>
  <circle cx="118" cy="85" r="7" fill="#F59E0B"/>
  <circle cx="141" cy="85" r="7" fill="#10B981"/>
  <text x="180" y="90" font-family="'BIZ UDPMincho', Georgia, serif" font-size="14" fill="#94A3B8">landmark.ai / customer-service-orchestrator</text>

  <!-- Left: AI Chat Stream -->
  <rect x="60" y="130" width="560" height="560" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="175" font-family="'BIZ UDPMincho', Georgia, serif" font-size="16" font-weight="bold" fill="#F8FAFC">LANDMARK AI AGENT</text>
  
  <!-- Chat bubbles -->
  <rect x="90" y="210" width="400" height="65" rx="6" fill="#1E293B"/>
  <text x="110" y="238" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#E2E8F0">"Hi, I need to reschedule my hotel booking for next Friday and inquire about late checkout."</text>

  <rect x="190" y="295" width="400" height="95" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
  <text x="210" y="325" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#93C5FD">● Agent: "I've located your booking #LM-8821. Rescheduled to Friday Oct 3rd. Late checkout until 2:00 PM confirmed without penalty."</text>

  <rect x="90" y="415" width="400" height="65" rx="6" fill="#1E293B"/>
  <text x="110" y="443" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#E2E8F0">"Can you also process the refund for the extra spa add-on?"</text>

  <rect x="190" y="500" width="400" height="85" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="210" y="530" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#6EE7B7">● Agent: "Refund of $85.00 triggered via payment gateway. Receipt sent to your registered email."</text>

  <!-- Right: RAG & AI Orchestration Pipeline -->
  <rect x="640" y="130" width="500" height="560" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="670" y="175" font-family="'BIZ UDPMincho', Georgia, serif" font-size="15" font-weight="bold" fill="#F8FAFC">RAG &amp; ORCHESTRATION PIPELINE</text>

  <rect x="670" y="210" width="440" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="695" y="240" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F59E0B">1. INTENT CLASSIFIER &amp; ENTITY EXTRACTION</text>
  <text x="695" y="265" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" fill="#94A3B8">Intent: RESCHEDULE_AND_REFUND (Confidence: 99.4%)</text>

  <rect x="670" y="305" width="440" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="695" y="335" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#60A5FA">2. VECTOR KNOWLEDGE RETRIEVAL (RAG)</text>
  <text x="695" y="360" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" fill="#94A3B8">Policy: Landmark Hotel Cancellation &amp; Spa Refund Rules</text>

  <rect x="670" y="400" width="440" height="75" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="695" y="430" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#34D399">3. TOOL EXECUTION &amp; API TRIGGER</text>
  <text x="695" y="455" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" fill="#94A3B8">API: POST /bookings/reschedule &amp; POST /refunds/trigger</text>

  <rect x="670" y="495" width="440" height="150" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="695" y="525" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F8FAFC">ORCHESTRATION METRICS</text>
  <text x="695" y="560" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#10B981">● Automated Resolution Rate: 78.4%</text>
  <text x="695" y="590" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#60A5FA">● Average Response Time: 1.2s</text>
  <text x="695" y="620" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" fill="#F59E0B">● Customer Satisfaction (CSAT): 4.8 / 5.0</text>
</svg>
