<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="hr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <pattern id="hr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#374151" stroke-width="0.75"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#hr-bg)"/>
  <rect width="1200" height="750" fill="url(#hr-grid)"/>

  <!-- Top bar -->
  <rect x="60" y="60" width="1080" height="50" rx="6" fill="#1F2937" stroke="#4B5563" stroke-width="1.5"/>
  <circle cx="95" cy="85" r="7" fill="#EF4444"/>
  <circle cx="118" cy="85" r="7" fill="#F59E0B"/>
  <circle cx="141" cy="85" r="7" fill="#10B981"/>
  <text x="180" y="90" font-family="'BIZ UDPMincho', Georgia, serif" font-size="14" fill="#9CA3AF">sabi.internal / hr-lifecycle-management</text>

  <!-- Left: Employee Lifecycle Kanban / Stages -->
  <rect x="60" y="130" width="1080" height="560" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="175" font-family="'BIZ UDPMincho', Georgia, serif" font-size="16" font-weight="bold" fill="#F9FAFB">DIGITIZED HR LIFECYCLE PIPELINE — SABI</text>

  <!-- 4 Columns -->
  <!-- Col 1: Offer & Onboarding -->
  <rect x="90" y="205" width="245" height="450" rx="6" fill="#1F2937" stroke="#4B5563"/>
  <text x="110" y="235" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" font-weight="bold" fill="#F59E0B">1. ONBOARDING (14)</text>
  <rect x="105" y="255" width="215" height="90" rx="4" fill="#111827" stroke="#374151"/>
  <text x="120" y="280" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F3F4F6">David Adeleke · Lead PM</text>
  <text x="120" y="305" font-family="'BIZ UDPMincho', Georgia, serif" font-size="11" fill="#10B981">✓ Digital Offer Letter Signed</text>
  <text x="120" y="325" font-family="'BIZ UDPMincho', Georgia, serif" font-size="11" fill="#9CA3AF">ID Card Generation: Pending</text>

  <rect x="105" y="360" width="215" height="90" rx="4" fill="#111827" stroke="#374151"/>
  <text x="120" y="385" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F3F4F6">Amara Nwosu · Frontend</text>
  <text x="120" y="410" font-family="'BIZ UDPMincho', Georgia, serif" font-size="11" fill="#10B981">✓ Onboarding Kit Dispatched</text>

  <!-- Col 2: Active Employee Records -->
  <rect x="360" y="205" width="245" height="450" rx="6" fill="#1F2937" stroke="#4B5563"/>
  <text x="380" y="235" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" font-weight="bold" fill="#60A5FA">2. ACTIVE WORKFORCE (320)</text>
  <rect x="375" y="255" width="215" height="90" rx="4" fill="#111827" stroke="#374151"/>
  <text x="390" y="280" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F3F4F6">Engineering &amp; Product</text>
  <text x="390" y="305" font-family="'BIZ UDPMincho', Georgia, serif" font-size="11" fill="#9CA3AF">84 Staff · Full Benefits Active</text>

  <!-- Col 3: Role Changes & Promotions -->
  <rect x="630" y="205" width="245" height="450" rx="6" fill="#1F2937" stroke="#4B5563"/>
  <text x="650" y="235" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" font-weight="bold" fill="#34D399">3. PROMOTIONS &amp; ROLES (8)</text>
  <rect x="645" y="255" width="215" height="90" rx="4" fill="#111827" stroke="#374151"/>
  <text x="660" y="280" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F3F4F6">Salary Adjustments Q3</text>
  <text x="660" y="305" font-family="'BIZ UDPMincho', Georgia, serif" font-size="11" fill="#10B981">✓ Approved in Azure DevOps</text>

  <!-- Col 4: Offboarding & Handover -->
  <rect x="900" y="205" width="215" height="450" rx="6" fill="#1F2937" stroke="#4B5563"/>
  <text x="920" y="235" font-family="'BIZ UDPMincho', Georgia, serif" font-size="13" font-weight="bold" fill="#F87171">4. OFFBOARDING (3)</text>
  <rect x="910" y="255" width="195" height="90" rx="4" fill="#111827" stroke="#374151"/>
  <text x="925" y="280" font-family="'BIZ UDPMincho', Georgia, serif" font-size="12" font-weight="bold" fill="#F3F4F6">Automated Asset Return</text>
  <text x="925" y="305" font-family="'BIZ UDPMincho', Georgia, serif" font-size="11" fill="#10B981">✓ System Access Revoked</text>
</svg>
