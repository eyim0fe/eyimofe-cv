    <pattern id="solar-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3F3F46" stroke-width="0.75"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#solar-bg)"/>
