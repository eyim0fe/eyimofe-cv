<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft shadow behind sticky note -->
    <filter id="noteShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    
    <!-- Subtle Tape Gradient -->
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#F3EAD3" stop-opacity="0.35" />
    </linearGradient>

    <!-- Warm Yellow Sticky Note Surface Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- Sticky Note Canvas Group (Slight 3deg rotation for authentic hand-drawn feel) -->
  <g transform="rotate(-3 256 256)">
    <!-- Sticky Note Base Card -->
    <rect 
      x="72" 
      y="84" 
      width="368" 
      height="368" 
      rx="16" 
      ry="16" 
      fill="url(#paperGrad)" 
      stroke="#FACC15" 
      stroke-width="3" 
      filter="url(#noteShadow)" 
    />

    <!-- Translucent Scotch Tape Strip at Top Center -->
    <rect 
      x="186" 
      y="62" 
      width="140" 
      height="44" 
      rx="4" 
      ry="4" 
      fill="url(#tapeGrad)" 
      stroke="rgba(0,0,0,0.08)" 
      stroke-width="1.5" 
      stroke-dasharray="4,2" 
      transform="rotate(1.5 256 84)" 
    />

    <!-- Red Push Pin in Top Right Corner -->
    <g transform="translate(390, 115)">
      <circle cx="0" cy="0" r="14" fill="#DC2626" />
      <circle cx="-3" cy="-3" r="5" fill="#EF4444" />
      <circle cx="2" cy="2" r="2" fill="#991B1B" />
    </g>

    <!-- EP Monogram Text -->
    <text 
      x="256" 
      y="312" 
      text-anchor="middle" 
      fill="#713F12" 
      font-family="system-ui, -apple-system, 'Instrument Sans', 'BIZ UDPMincho', sans-serif" 
      font-size="160" 
      font-weight="900" 
      letter-spacing="-0.04em"
    >EP</text>
  </g>
</svg>